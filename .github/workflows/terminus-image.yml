name: Terminus image

# Builds LND from this branch with LND's own Dockerfile — the same file and the same
# `make release-install` the official lightninglabs/lnd image is built with — and
# publishes it as ghcr.io/<owner>/lnd-terminus:<release>. The only difference from
# the official image of the same release is the one commit on this branch.

on:
  push:
    branches:
      - 'v*-terminus'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Names
        run: |
          BR="${GITHUB_REF_NAME}"
          echo "RELEASE=${BR%-terminus}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lnd-terminus" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.RELEASE }}
          build-args: |
            checkout=${{ github.sha }}
            git_url=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=LND ${{ env.RELEASE }} plus one commit: zero-conf and scid-alias on static-remote-key channels

      - name: Image digest
        run: |
          echo "${{ env.IMAGE }}:${{ env.RELEASE }}@${{ steps.build.outputs.digest }}"
          echo "### ${{ env.IMAGE }}:${{ env.RELEASE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # The same `make release-install`, run on the runner instead of in Docker, for nodes
  # that run LND as a plain binary. Published as the GitHub release
  # terminus-<release> with a sha256 file. A release that already exists is never
  # overwritten: this step fails instead, and a new release needs a new name.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Names
        run: |
          BR="${GITHUB_REF_NAME}"
          echo "RELEASE=${BR%-terminus}" >> "$GITHUB_ENV"
          echo "GO_VERSION=$(sed -n 's/^GO_VERSION = //p' Makefile)" >> "$GITHUB_ENV"

      - name: Base release tag, for the version string
        run: git fetch --depth=10 https://github.com/lightningnetwork/lnd "refs/tags/${RELEASE}:refs/tags/${RELEASE}"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build lnd and lncli (linux-amd64)
        run: make release-install

      - name: Package
        run: |
          NAME="lnd-terminus-linux-amd64-${RELEASE}"
          mkdir "$NAME"
          cp "$(go env GOPATH)/bin/lnd" "$(go env GOPATH)/bin/lncli" "$NAME/"
          "$NAME/lnd" --version
          tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"
          echo "### $(cat "$NAME.tar.gz.sha256")" >> "$GITHUB_STEP_SUMMARY"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="terminus-${RELEASE}"
          gh release create "$TAG" "$NAME.tar.gz" "$NAME.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "LND ${RELEASE} plus one commit: zero-conf and scid-alias on static-remote-key channels (no anchors). Built from ${GITHUB_SHA} with LND's make release-install, Go ${GO_VERSION}, linux-amd64."
